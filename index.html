<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Apps | Max Weberman</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600&family=Khand:wght@700&display=swap" rel="stylesheet">

</head><body>
<header class="top"><div class="wrap bar"><span class="wordmark">MAX WEBERMAN</span>
  <div class="bar-right"><span id="clock" class="label"></span><button id="refresh" class="btn sm mw-hover">Refresh</button></div></div></header>
<main class="wrap">
  <div class="headrow"><h1>App Hub</h1>
    <label class="label sortlbl">Sort <select id="sort" aria-label="Sort Apps"><option value="default">Brief App First</option><option value="az">Name A-Z</option><option value="recent">Last Update</option><option value="asks">Open Asks</option></select></label></div>
  <p id="msg" class="muted">Live apps. Last update comes from GitHub. Open asks come from the Brief App on this device.</p>
  <section id="tiles" class="tiles"></section>
</main>
<div class="sharebar"><button id="share" class="btn share mw-hover" aria-label="Share App Hub">Share</button></div>
<footer class="foot"><div class="wrap">MAX WEBERMAN · App Hub</div></footer>
<script src="apps.js"></script><script src="app.js"></script>
<!-- mw-built-footer -->
<style>.mw-built{display:block;clear:both;width:100%;box-sizing:border-box;margin:0;padding:14px 16px calc(14px + var(--mw-built-pad,0px) + env(safe-area-inset-bottom,0px));background:#fafaf8;text-align:center;font-family:Hind,system-ui,sans-serif;font-size:12px;line-height:1.4;color:#8a8a8a;position:relative;z-index:1}.mw-built a{color:#8a8a8a;text-decoration:none;transition:color .15s,opacity .15s}.mw-built a.mw-hover:hover,.mw-built a:focus-visible{color:#555;text-decoration:underline}</style>
<footer class="mw-built"><a class="mw-hover" href="https://maxweberman.com" target="_blank" rel="noopener">Built by Max Weberman</a></footer>
<script>(function(){var r=document.documentElement;function m(){var ft=document.querySelector('.mw-built'),h=0,vh=innerHeight;if(!ft)return;document.querySelectorAll('body *').forEach(function(e){if(ft.contains(e))return;var s=getComputedStyle(e);if((s.position=='fixed'||s.position=='sticky')&&s.display!='none'&&s.visibility!='hidden'){var b=e.getBoundingClientRect();if(b.height>0&&b.height<vh*.5&&b.bottom>=vh-2&&b.top>vh*.5)h=Math.max(h,vh-b.top)}});r.style.setProperty('--mw-built-pad',Math.ceil(h)+'px')}addEventListener('load',m);addEventListener('resize',m);setTimeout(m,600);setTimeout(m,2000)})();</script>
<!-- /mw-built-footer -->
</body></html>
